<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun IT</title>
    <link rel="stylesheet" href="css/sun.css">
</head>
<body>
    <header>
        <div id="head">
            <div class="logo">
                <a href="#" target="_blank">Sun IT</a>
            </div>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section>
            <div id="hero">
                <div id="box-hero">
                    <h2 id="title-hero">Create Your Site as Bright Like Sun</h2>
                    <button id="btn-hero">Get Started!</button>
                </div>
            </div>
        </section>
        <section>
            <form action="" method="get">
                <h3 id="#title-form">Free Service First</h3>
                <fieldset id="main-from-set">
                    <legend>Personal Information</legend>
                    <label for="name">Name</label>
                    <input type="text" id="name">
                    <label for="email">Email</label>
                    <input type="email" id="name">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone">
                    <label for="address">Address</label>
                    <input type="text" id="address"></input>
                </fieldset>
                <fieldset id="need">
                    <legend>Describe Your Needs</legend>
                    <textarea name="needs" id="need-text" cols="auto" placeholder="Write well your needs here into this box"></textarea>
                </fieldset>
                <div class="action-btn">
                    <input type="button" value="Submit" name="act-btn">
                    <input type="reset" value="Reset" name="act-btn">
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>The Sun IT</p>
    </footer>
</body>
</html>
